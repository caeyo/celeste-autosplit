[package]
name = "celeste-autosplit"
version = "0.1.0"
edition = "2021"

[dependencies]
asr = { git = "https://github.com/LiveSplit/asr", rev = "a7ecee85abad7263bfa2150d3821f3d2ea69fe84", features = [
    "alloc",
    "flags",
    "integer-vars",
    "signature",
] }

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true

[profile.release.build-override]
opt-level = 0
