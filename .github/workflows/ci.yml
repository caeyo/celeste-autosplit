name: CI

on:
  pull_request:
    paths:
      - 'autosplitter/**'
      - 'harness/**'
      - 'component/**'
      - 'site/test/cases/**'
      - 'schema/**'
      - '.github/workflows/ci.yml'
      - 'rust-toolchain.toml'
      - 'global.json'
      - 'tools/trace-recorder/**'
      - '!**/*.md'
  push:
    branches:
      - 'master'
    paths:
      - 'autosplitter/**'
      - 'harness/**'
      - 'component/**'
      - 'site/test/cases/**'
      - 'schema/**'
      - '.github/workflows/ci.yml'
      - 'rust-toolchain.toml'
      - 'global.json'
      - 'tools/trace-recorder/**'
      - '!**/*.md'
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Check formatting and clippy lints
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Cache Rust build
        if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: harness

      - name: Run cargo fmt
        working-directory: autosplitter
        run: cargo fmt -- --check

      - name: Run cargo fmt on the harness
        if: github.ref_type != 'tag'
        working-directory: harness
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: autosplitter
        run: cargo clippy --locked -- -D warnings

      - name: Run Clippy on the harness
        if: github.ref_type != 'tag'
        working-directory: harness
        run: cargo clippy --locked -- -D warnings

  build:
    name: Build and test
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: autosplitter

      - name: Build wasm module
        working-directory: autosplitter
        run: cargo b --release --locked

      - name: Build component
        working-directory: component
        run: dotnet build -c Release

      - name: Test component
        working-directory: component
        run: dotnet test -c Release --no-build

      - name: Upload wasm module
        uses: actions/upload-artifact@v7
        with:
          name: autosplitter
          path: autosplitter/target/wasm32-unknown-unknown/release/celeste_autosplit.wasm
          if-no-files-found: error

      - name: Upload component
        uses: actions/upload-artifact@v7
        with:
          name: component
          path: component/CelesteAutosplit/bin/Release/net4.8.1/celeste-autosplit.dll
          if-no-files-found: error

  harness-test:
    name: Test the harness
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: harness

      - name: Run the harness's tests
        working-directory: harness
        run: cargo test --locked

  recorder:
    name: Build the trace recorder
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build trace recorder
        run: dotnet build tools/trace-recorder
