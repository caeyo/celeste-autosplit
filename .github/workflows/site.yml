name: Site

on:
  push:
    branches:
      - 'master'
    paths:
      - 'site/**'
      - 'schema/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          rm _site/README.md _site/serve.mjs
          cp schema/settings-schema.json _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
