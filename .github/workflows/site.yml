name: Site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'schema/**'
      - 'component/CelesteAutosplit/LegacyMigration.cs'
      - 'legacy-splits/**'
      - 'traces/prologue.triggers*.json'
      - '.github/workflows/site.yml'
      - 'global.json'
      - '!**/*.md'
  push:
    branches:
      - 'master'
    paths:
      - 'site/**'
      - 'schema/**'
      - 'component/CelesteAutosplit/LegacyMigration.cs'
      - 'legacy-splits/**'
      - 'traces/prologue.triggers*.json'
      - '.github/workflows/site.yml'
      - 'global.json'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test the site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.0

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run the site's checks
        run: bash site/test/run.sh

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the legacy import
        run: dotnet publish site/legacy-import -c Release

      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          rm -rf _site/serve.mjs _site/test _site/legacy-import
          find _site/legacy -maxdepth 1 -type f -delete
          cp schema/settings-schema.json _site/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
