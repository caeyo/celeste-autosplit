name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  live-check:
    uses: ./.github/workflows/live-check.yml
    secrets:
      GAME_FILES_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}

  release:
    name: Publish release
    needs: [ci, live-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Check the tag is on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag $GITHUB_REF_NAME isn't on master"
            exit 1
          fi

      - name: Check version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' component/CelesteAutosplit/CelesteAutosplit.csproj)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match component version $version"
            exit 1
          fi
          livesplit=$(sed -n 's:.*<LiveSplitVersion>\(.*\)</LiveSplitVersion>.*:\1:p' component/Directory.Build.props)
          echo "LIVESPLIT_VERSION=$livesplit" >> "$GITHUB_ENV"

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/celeste-autosplit.dll dist/celeste_autosplit.wasm \
            --verify-tag --latest --generate-notes --notes "Built against LiveSplit $LIVESPLIT_VERSION."
