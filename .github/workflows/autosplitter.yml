name: Autosplitter

on:
  pull_request:
    paths:
      - 'autosplitter/**'
      - '.github/workflows/autosplitter.yml'
  push:
    branches:
      - 'master'
    paths:
      - 'autosplitter/**'
      - '.github/workflows/autosplitter.yml'
  workflow_call:

defaults:
  run:
    working-directory: autosplitter

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          rust-version: stable
          targets: wasm32-unknown-unknown

      - name: Build
        run: |
          cargo b --release --locked
          cp target/wasm32-unknown-unknown/release/celeste_autosplit.wasm celeste-autosplit.wasm

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: autosplitter
          path: autosplitter/celeste-autosplit.wasm
          if-no-files-found: error

  clippy:
    name: Check clippy lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Run Clippy
        run: cargo clippy --all-features

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt -- --check || true
