name: Autosplitter

# Builds the wasm module, and lints and checks the formatting of both Rust crates, the auto
# splitter and the harness. Warnings fail the checks.
on:
  pull_request:
    paths:
      - 'autosplitter/**'
      - 'harness/**'
      - '.github/workflows/autosplitter.yml'
  push:
    branches:
      - 'master'
    paths:
      - 'autosplitter/**'
      - 'harness/**'
      - '.github/workflows/autosplitter.yml'
  workflow_call:

defaults:
  run:
    working-directory: autosplitter

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          rust-version: stable
          targets: wasm32-unknown-unknown

      - name: Build
        run: cargo b --release --locked

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: autosplitter
          path: autosplitter/target/wasm32-unknown-unknown/release/celeste_autosplit.wasm
          if-no-files-found: error

  clippy:
    name: Check clippy lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Run Clippy
        run: cargo clippy --all-features -- -D warnings

  harness-clippy:
    name: Check the harness's clippy lints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --locked -- -D warnings

  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path ../harness/Cargo.toml -- --check
