name: Component

# The tests run the wasm module inside LiveSplit's ASR component, so changes to the
# auto splitter, or to the layouts it's built with, run them too.
on:
  pull_request:
    paths:
      - 'component/**'
      - 'schema/**'
      - 'autosplitter/**'
      - 'layouts/**'
      - '.github/workflows/component.yml'
  push:
    branches:
      - 'master'
    paths:
      - 'component/**'
      - 'schema/**'
      - 'autosplitter/**'
      - 'layouts/**'
      - '.github/workflows/component.yml'
  workflow_call:

defaults:
  run:
    working-directory: component

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: component/global.json

      - name: Cache LiveSplit reference
        uses: actions/cache@v6
        with:
          path: component/.deps
          key: livesplit-${{ hashFiles('component/Directory.Build.props') }}

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          rust-version: stable
          targets: wasm32-unknown-unknown

      # Before the solution build, which copies the wasm module next to the tests.
      - name: Build wasm module
        working-directory: autosplitter
        run: cargo b --release --locked

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: component
          path: component/CelesteAutosplit/bin/Release/net4.8.1/celeste-autosplit.dll
          if-no-files-found: error
