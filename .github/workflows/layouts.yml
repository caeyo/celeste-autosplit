name: Layouts

# The harness runs the auto splitter, built with the committed layouts, against each
# vanilla flavour's game, which the probe constructs inside the flavour's own runtime next
# to the real game files: the live check, then the replay of every trace.
#
# The game files are release assets of a private repository, fetched with the
# GAME_FILES_TOKEN secret: only the files the probe needs to construct the game, without
# Content, which it never reads. They never go into caches or artifacts. Besides dispatch,
# this runs for pushes and pull requests that change the auto splitter, the layouts, the
# harness, the probe or the traces. A pull request only restores the Rust build caches of
# its own runs and of master's, so the runs on master keep every pull request's first run
# warm.
#
# Secrets never reach a fork's pull_request run, so a pull request from a fork runs
# through pull_request_target instead: master's workflow, with secrets, on the pull
# request's code, which could take the game files or the token. So its jobs wait in the
# game-files environment until a maintainer approves the run, after reviewing the code.
# They check out the head commit the run was started for, so a later push waits for its
# own approval, and they save no caches, since master's runs would restore them. A pull
# request from this repository runs through pull_request, with the workflow as it
# changes it, and its pull_request_target run skips its jobs.

on:
  workflow_dispatch:
  pull_request:
    paths: &paths
      - 'autosplitter/**'
      - 'layouts/**'
      - 'harness/**'
      - 'tools/probe/**'
      - 'traces/**'
      - '.github/workflows/layouts.yml'
      - 'rust-toolchain.toml'
      - 'global.json'
      - '!**/*.md'
  pull_request_target:
    paths: *paths
  push:
    branches:
      - 'master'
    paths: *paths

permissions:
  contents: read

# A pull_request_target run's ref is master's, so a fork's pull request gets a group of
# its own.
concurrency:
  group: layouts-${{ github.event_name == 'pull_request_target' && format('fork-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  GAME_FILES_REPO: caeyo/celeste-autosplit-gamefiles
  GAME_FILES_TAG: gamefiles-v2
  PROBE_BUILD: tools/probe/bin/Release/net45
  # The screen Xvfb gives FNA's window, on Linux.
  XVFB_SCREEN: '-screen 0 1280x720x24'

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: ${{ matrix.flavour }}
    # Pull requests from this repository through pull_request, from forks through
    # pull_request_target.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      || github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    # Its required reviewers approve a fork's run before any of its jobs start.
    environment: ${{ github.event_name == 'pull_request_target' && 'game-files' || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: windows-xna
            runner: windows-2025-vs2026
          - flavour: windows-fna
            runner: windows-2025-vs2026
          - flavour: linux
            runner: ubuntu-24.04
          # The game is x86_64 only: on arm64 it runs under Rosetta.
          - flavour: macos
            runner: macos-26
    steps:
      # The game's code runs in this job, so it doesn't keep the checkout's token. A fork's
      # run checks out the commit it was approved for, not the branch, which can move.
      - name: Checkout Commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build probe
        run: dotnet build tools/probe -c Release

      - name: Install Rust
        run: rustup toolchain install --profile minimal --no-self-update

      # The two Windows flavours share one cache. Only ~/.cargo and the target directories
      # go into it, never the game files.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            autosplitter
            harness
          save-if: ${{ github.event_name != 'pull_request_target' }}

      - name: Build auto splitter and harness
        run: |
          (cd autosplitter && cargo b --release --locked)
          (cd harness && cargo build --release --locked)

      - name: Fetch game files
        env:
          GH_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
          ZIP: celeste-${{ matrix.flavour }}.zip
        run: |
          gh release download "$GAME_FILES_TAG" --repo "$GAME_FILES_REPO" --pattern "$ZIP" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$ZIP" -d "$RUNNER_TEMP/game"
          rm "$RUNNER_TEMP/$ZIP"

      # XNA's assemblies load from the GAC, so XNA builds need the redistributable. It
      # also installs the VC++ 2010 runtime and DirectX pieces its assemblies import.
      - name: Install XNA 4.0
        if: matrix.flavour == 'windows-xna'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
        run: |
          gh release download $env:GAME_FILES_TAG --repo $env:GAME_FILES_REPO --pattern xna-redist-4.0.zip --dir $env:RUNNER_TEMP
          Expand-Archive $env:RUNNER_TEMP\xna-redist-4.0.zip $env:RUNNER_TEMP\xna
          $xna = Start-Process msiexec -ArgumentList '/i', "$env:RUNNER_TEMP\xna\xnafx40_redist.msi", '/qn', '/norestart' -Wait -PassThru
          "XNA installer exit code: $($xna.ExitCode)"
          if ($xna.ExitCode -notin 0, 3010) { exit 1 }

      # The probe runs as the game, the way the auto splitter will see it: the probe
      # becomes Celeste.exe, the game's own Celeste.exe moves to real/, and it starts the
      # way players start the game.

      - name: Install probe (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/game
        run: |
          mkdir real
          mv Celeste.exe real/
          cp "$GITHUB_WORKSPACE/$PROBE_BUILD/Probe.exe" Celeste.exe

      # The script runs Celeste.bin.x86_64, a MonoKickstart that runs Celeste.exe with the
      # game's own Mono. FNA needs a display to create its window. The runner image already
      # has Xvfb and Mesa, and the window never gets a GL context, so software rendering is
      # enough.
      - name: Install probe (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/game
        run: |
          mkdir real
          mv Celeste.exe real/
          cp "$GITHUB_WORKSPACE/$PROBE_BUILD/Probe.exe" Celeste.exe
          chmod +x Celeste Celeste.bin.x86_64

      # MacOS/Celeste is a MonoKickstart that runs Resources/Celeste.exe with the game's own
      # Mono.
      - name: Install probe (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/game/Celeste.app/Contents
        run: |
          mkdir Resources/real
          mv Resources/Celeste.exe Resources/real/
          cp "$GITHUB_WORKSPACE/$PROBE_BUILD/Probe.exe" Resources/Celeste.exe
          chmod +x MacOS/Celeste

      # The harness starts the probe as the game, attaches the auto splitter to it, and
      # runs the live check, then replays every trace. On Linux, the probe is then the
      # harness's descendant, whose memory Yama lets it read. On macOS, reading another
      # process's memory needs root, so the harness runs as root, and starts the probe as the
      # normal user, as players run the game.
      - name: Live check and replay
        timeout-minutes: 5
        run: |
          harness=harness/target/release/harness
          game="$RUNNER_TEMP/game"
          case "$RUNNER_OS" in
            Windows)
              "$harness" traces/*.jsonl -- "$game/Celeste.exe" host ;;
            Linux)
              "$harness" traces/*.jsonl -- xvfb-run -a -s "$XVFB_SCREEN" "$game/Celeste" host ;;
            macOS)
              sudo "$harness" traces/*.jsonl -- sudo -u "$(id -un)" "$game/Celeste.app/Contents/MacOS/Celeste" host ;;
            *)
              echo "::error::No way to start the probe on $RUNNER_OS."
              exit 1 ;;
          esac

      - name: Dump
        if: always()
        timeout-minutes: 4
        run: |
          game="$RUNNER_TEMP/game"
          case "$RUNNER_OS" in
            Windows)
              "$game/Celeste.exe" dump ;;
            Linux)
              xvfb-run -a -s "$XVFB_SCREEN" "$game/Celeste" dump ;;
            macOS)
              "$game/Celeste.app/Contents/MacOS/Celeste" dump ;;
            *)
              echo "::error::No way to start the probe on $RUNNER_OS."
              exit 1 ;;
          esac
