name: Layouts

# Measures each vanilla flavour's memory layout with the layout probe, inside the
# flavour's own runtime next to the real game files, as layouts/<flavour>.rs. Then the
# auto splitter is built with it, and the live check runs it against the game the probe
# constructed and holds. On dispatch, a last job opens a pull request into the dispatched
# branch with the regenerated layouts. On a pull request, each committed layout must be
# the one the probe writes.
#
# The game files are release assets of a private repository, fetched with the
# GAME_FILES_TOKEN secret. They never go into caches or artifacts (only the measured
# layouts do). Besides dispatch, this runs for pull requests that change the auto
# splitter, the layouts, the harness or the probe, but only from this repository:
# secrets never reach pull requests from forks.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'autosplitter/**'
      - 'layouts/**'
      - 'harness/**'
      - 'tools/layout-probe/**'
      - '.github/workflows/layouts.yml'

permissions:
  contents: read

concurrency:
  group: layouts-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_FILES_REPO: caeyo/celeste-autosplit-gamefiles
  GAME_FILES_TAG: gamefiles-v1
  PROBE_BUILD: tools/layout-probe/bin/Release/net45

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: ${{ matrix.flavour }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: windows-xna
            runner: windows-latest
          - flavour: windows-fna
            runner: windows-latest
          - flavour: linux
            runner: ubuntu-latest
          # The game is x86_64 only: on arm64 it runs under Rosetta.
          - flavour: macos
            runner: macos-latest
    steps:
      # The game's code runs in this job, so it doesn't keep the checkout's token.
      - name: Checkout Commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build probe
        run: dotnet build tools/layout-probe -c Release

      - name: Install Rust
        uses: hecrj/setup-rust-action@v2
        with:
          rust-version: stable
          targets: wasm32-unknown-unknown

      # The auto splitter is rebuilt with the layout the probe writes, before the live check.
      # Building it here builds its dependencies, so that the rebuild only takes seconds.
      - name: Build auto splitter and harness
        run: |
          (cd autosplitter && cargo b --release --locked)
          (cd harness && cargo build --release --locked)

      - name: Fetch game files
        env:
          GH_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
          ZIP: celeste-${{ matrix.flavour }}.zip
        run: |
          gh release download "$GAME_FILES_TAG" --repo "$GAME_FILES_REPO" --pattern "$ZIP" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$ZIP" -d "$RUNNER_TEMP/game"
          rm "$RUNNER_TEMP/$ZIP"

      # XNA's assemblies load from the GAC, so XNA builds need the redistributable. It
      # also installs the VC++ 2010 runtime and DirectX pieces its assemblies import.
      - name: Install XNA 4.0
        if: matrix.flavour == 'windows-xna'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
        run: |
          gh release download $env:GAME_FILES_TAG --repo $env:GAME_FILES_REPO --pattern xna-redist-4.0.zip --dir $env:RUNNER_TEMP
          Expand-Archive $env:RUNNER_TEMP\xna-redist-4.0.zip $env:RUNNER_TEMP\xna
          $xna = Start-Process msiexec -ArgumentList '/i', "$env:RUNNER_TEMP\xna\xnafx40_redist.msi", '/qn', '/norestart' -Wait -PassThru
          "XNA installer exit code: $($xna.ExitCode)"
          if ($xna.ExitCode -notin 0, 3010) { exit 1 }

      - name: Check x86_64 support
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
          if [ "$(uname -m)" = arm64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Installing Rosetta"
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true && echo "x86_64 binaries run"

      # The probe runs as the game, the way the auto splitter will see it: the probe
      # becomes Celeste.exe, the game's own Celeste.exe moves to real/, and it starts the
      # way players start the game. The game's Linux script changes directory first, so
      # the paths given to the probe are absolute. Its output goes to a file, so that it
      # can keep running, and holding the game for the live check, once the step ends.

      - name: Start probe (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/game
        run: |
          mkdir real
          mv Celeste.exe real/
          [ ! -f Celeste.exe.config ] || mv Celeste.exe.config real/
          cp "$GITHUB_WORKSPACE/$PROBE_BUILD/LayoutProbe.exe" Celeste.exe
          ./Celeste.exe --game real/Celeste.exe --out "$RUNNER_TEMP/layouts" --values "$RUNNER_TEMP/values.json" --hold 120 > "$RUNNER_TEMP/probe.log" 2>&1 &

      # The script runs Celeste.bin.x86_64, a MonoKickstart that runs Celeste.exe with the
      # game's own Mono. FNA needs a display to create its window. The runner image already
      # has Xvfb and Mesa, and the window never gets a GL context, so software rendering is
      # enough.
      - name: Start probe (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}/game
        run: |
          mkdir real
          mv Celeste.exe Celeste.exe.config real/
          cp "$GITHUB_WORKSPACE/$PROBE_BUILD/LayoutProbe.exe" Celeste.exe
          chmod +x Celeste Celeste.bin.x86_64
          xvfb-run -a -s '-screen 0 1280x720x24' ./Celeste --game real/Celeste.exe --out "$RUNNER_TEMP/layouts" --values "$RUNNER_TEMP/values.json" --hold 120 > "$RUNNER_TEMP/probe.log" 2>&1 &

      # MacOS/Celeste is a MonoKickstart that runs Resources/Celeste.exe with the game's own
      # Mono.
      - name: Start probe (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/game/Celeste.app/Contents
        run: |
          mkdir Resources/real
          mv Resources/Celeste.exe Resources/real/
          cp "$GITHUB_WORKSPACE/$PROBE_BUILD/LayoutProbe.exe" Resources/Celeste.exe
          chmod +x MacOS/Celeste
          MacOS/Celeste --game real/Celeste.exe --out "$RUNNER_TEMP/layouts" --values "$RUNNER_TEMP/values.json" --hold 120 > "$RUNNER_TEMP/probe.log" 2>&1 &

      # Once every check has passed, the probe writes its layout and the values it holds,
      # prints "probe: ok", and holds the game. Otherwise it prints "probe: failed".
      - name: Wait for probe
        timeout-minutes: 4
        run: |
          for _ in $(seq 180); do
            grep -q '^probe: ' "$RUNNER_TEMP/probe.log" && break
            sleep 1
          done
          cat "$RUNNER_TEMP/probe.log"
          grep -q '^probe: ok' "$RUNNER_TEMP/probe.log" || {
            echo "::error::The probe failed, or didn't finish within 180 s: see its log above."
            exit 1
          }

      # The probe's layout replaces the committed one, so that the live check always tests
      # the offsets just measured. The probe names the file after the flavour it detected, so
      # a mislabelled matrix entry fails here.
      - name: Build auto splitter with the probe's layout
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          cp "$RUNNER_TEMP/layouts/$FLAVOUR.rs" layouts/
          (cd autosplitter && cargo b --release --locked)

      # The live check attaches the auto splitter to the probe's process, and compares. It
      # runs as root on Linux, where Yama only lets a process read the memory of its own
      # descendants, and on macOS, where reading another process's memory needs root.
      - name: Live check
        timeout-minutes: 3
        run: |
          [ "$RUNNER_OS" = Windows ] || sudo=sudo
          $sudo harness/target/release/harness live --values "$RUNNER_TEMP/values.json"

      # A difference is a hand edit, or a change to the probe (its manifest or its output)
      # without regenerating the layouts.
      - name: Check committed layout
        if: github.event_name == 'pull_request'
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          git diff --exit-code -- "layouts/$FLAVOUR.rs" || {
            echo "::error::layouts/$FLAVOUR.rs isn't what the probe writes: regenerate it with the Layouts workflow."
            exit 1
          }

      - name: Upload layout
        uses: actions/upload-artifact@v7
        with:
          name: layout-${{ matrix.flavour }}
          path: ${{ runner.temp }}/layouts/${{ matrix.flavour }}.rs
          if-no-files-found: error
          retention-days: 7

  # Only on dispatch. A pull request needs a branch to go into, so a run dispatched on a
  # tag only probes.
  pull-request:
    name: Open pull request
    needs: probe
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Download layouts
        uses: actions/download-artifact@v8
        with:
          pattern: layout-*
          merge-multiple: true
          path: layouts

      # Needs "Allow GitHub Actions to create and approve pull requests" in the
      # repository's Actions settings. Each base branch gets one layouts/<base> branch,
      # force-pushed on every run, so an open pull request is updated, not duplicated.
      # GITHUB_TOKEN opens it, so the workflow runs it triggers wait for someone to approve
      # them.
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: layouts/${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[].number')
          git add layouts
          if git diff --cached --quiet; then
            echo "The layouts haven't changed."
            # A pull request from an earlier run no longer matches what the probe measures.
            if [ -n "$open" ]; then
              gh pr close "$open" --delete-branch --comment "Out of date: [a later run]($RUN_URL) found the layouts unchanged."
            fi
            exit 0
          fi
          git diff --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -q -m "Regenerate layouts" -m "Measured by $RUN_URL"
          git push --force origin "$BRANCH"
          if [ -n "$open" ]; then
            echo "Updated the open pull request from $BRANCH."
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "Regenerate layouts" \
              --body "Measured by the layout probe in [this run]($RUN_URL), on every flavour in its matrix. Each flavour's hand-written signature and store matched its anchor's compiled code, the probe read every path back raw through the slot, and the live check found the auto splitter, built with the regenerated layout, reporting the values the probe held."
          fi
