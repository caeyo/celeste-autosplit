name: Layouts

# Measures each vanilla flavour's memory layout with the probe, inside the flavour's own
# runtime next to the real game files, as layouts/<flavour>.rs. Then the auto splitter is
# built with it, and the harness runs it against the game, which the probe constructs
# again: the live check, then the replay of every trace. On dispatch, a last job opens a
# pull request into the dispatched branch with the regenerated layouts. On a pull request,
# each committed layout must be the one the probe writes.
#
# The game files are release assets of a private repository, fetched with the
# GAME_FILES_TOKEN secret: only the files the probe needs to construct the game, without
# Content, which it never reads. They never go into caches or artifacts (only the measured
# layouts do). Besides dispatch, this runs for pushes and pull requests that change the
# auto splitter, the layouts, the harness, the probe or the traces. A pull request only
# restores the Rust build caches of its own runs and of master's, so the runs on master
# keep every pull request's first run warm.
#
# Secrets never reach a fork's pull_request run, so a pull request from a fork runs
# through pull_request_target instead: master's workflow, with secrets, on the pull
# request's code, which could take the game files or the token. So its jobs wait in the
# game-files environment until a maintainer approves the run, after reviewing the code.
# They check out the head commit the run was started for, so a later push waits for its
# own approval, and they save no caches, since master's runs would restore them. A pull
# request from this repository runs through pull_request, with the workflow as it
# changes it, and its pull_request_target run skips its jobs.

on:
  workflow_dispatch:
  pull_request:
    paths: &paths
      - 'autosplitter/**'
      - 'layouts/**'
      - 'harness/**'
      - 'tools/probe/**'
      - 'traces/**'
      - '.github/workflows/layouts.yml'
  pull_request_target:
    paths: *paths
  push:
    branches:
      - 'master'
    paths: *paths

permissions:
  contents: read

# A pull_request_target run's ref is master's, so a fork's pull request gets a group of
# its own.
concurrency:
  group: layouts-${{ github.event_name == 'pull_request_target' && format('fork-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  GAME_FILES_REPO: caeyo/celeste-autosplit-gamefiles
  GAME_FILES_TAG: gamefiles-v2
  PROBE_BUILD: tools/probe/bin/Release/net45
  # The screen Xvfb gives FNA's window, on Linux.
  XVFB_SCREEN: '-screen 0 1280x720x24'

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: ${{ matrix.flavour }}
    # Pull requests from this repository through pull_request, from forks through
    # pull_request_target.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      || github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    # Its required reviewers approve a fork's run before any of its jobs start.
    environment: ${{ github.event_name == 'pull_request_target' && 'game-files' || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavour: windows-xna
            runner: windows-latest
          - flavour: windows-fna
            runner: windows-latest
          - flavour: linux
            runner: ubuntu-latest
          # The game is x86_64 only: on arm64 it runs under Rosetta.
          - flavour: macos
            runner: macos-latest
    steps:
      # The game's code runs in this job, so it doesn't keep the checkout's token. A fork's
      # run checks out the commit it was approved for, not the branch, which can move.
      - name: Checkout Commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build probe
        run: dotnet build tools/probe -c Release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The two Windows flavours share one cache. Only ~/.cargo and the target directories
      # go into it, never the game files.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            autosplitter
            harness
          save-if: ${{ github.event_name != 'pull_request_target' }}

      # The auto splitter is rebuilt with the layout the probe writes, before the harness runs
      # it. Building it here builds its dependencies, so that the rebuild only takes seconds.
      - name: Build auto splitter and harness
        run: |
          (cd autosplitter && cargo b --release --locked)
          (cd harness && cargo build --release --locked)

      - name: Fetch game files
        env:
          GH_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
          ZIP: celeste-${{ matrix.flavour }}.zip
        run: |
          gh release download "$GAME_FILES_TAG" --repo "$GAME_FILES_REPO" --pattern "$ZIP" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/$ZIP" -d "$RUNNER_TEMP/game"
          rm "$RUNNER_TEMP/$ZIP"

      # XNA's assemblies load from the GAC, so XNA builds need the redistributable. It
      # also installs the VC++ 2010 runtime and DirectX pieces its assemblies import.
      - name: Install XNA 4.0
        if: matrix.flavour == 'windows-xna'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GAME_FILES_TOKEN }}
        run: |
          gh release download $env:GAME_FILES_TAG --repo $env:GAME_FILES_REPO --pattern xna-redist-4.0.zip --dir $env:RUNNER_TEMP
          Expand-Archive $env:RUNNER_TEMP\xna-redist-4.0.zip $env:RUNNER_TEMP\xna
          $xna = Start-Process msiexec -ArgumentList '/i', "$env:RUNNER_TEMP\xna\xnafx40_redist.msi", '/qn', '/norestart' -Wait -PassThru
          "XNA installer exit code: $($xna.ExitCode)"
          if ($xna.ExitCode -notin 0, 3010) { exit 1 }

      - name: Check x86_64 support
        if: runner.os == 'macOS'
        run: |
          sw_vers
          uname -m
          if [ "$(uname -m)" = arm64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Installing Rosetta"
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true && echo "x86_64 binaries run"

      # The probe runs as the game, the way the auto splitter will see it: the probe
      # becomes Celeste.exe, the game's own Celeste.exe moves to real/, and it starts the
      # way players start the game. The game's Linux script changes directory first, so
      # the paths given to the probe are absolute. Once every check has passed, it writes
      # its layout and prints "probe: ok". Otherwise it prints "probe: failed" and exits
      # with 1.

      - name: Probe (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 4
        working-directory: ${{ runner.temp }}/game
        run: |
          mkdir real
          mv Celeste.exe real/
          cp "$GITHUB_WORKSPACE/$PROBE_BUILD/Probe.exe" Celeste.exe
          ./Celeste.exe --game real/Celeste.exe --out "$RUNNER_TEMP/layouts"

      # The script runs Celeste.bin.x86_64, a MonoKickstart that runs Celeste.exe with the
      # game's own Mono. FNA needs a display to create its window. The runner image already
      # has Xvfb and Mesa, and the window never gets a GL context, so software rendering is
      # enough.
      - name: Probe (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 4
        working-directory: ${{ runner.temp }}/game
        run: |
          mkdir real
          mv Celeste.exe real/
          cp "$GITHUB_WORKSPACE/$PROBE_BUILD/Probe.exe" Celeste.exe
          chmod +x Celeste Celeste.bin.x86_64
          xvfb-run -a -s "$XVFB_SCREEN" ./Celeste --game real/Celeste.exe --out "$RUNNER_TEMP/layouts"

      # MacOS/Celeste is a MonoKickstart that runs Resources/Celeste.exe with the game's own
      # Mono.
      - name: Probe (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        working-directory: ${{ runner.temp }}/game/Celeste.app/Contents
        run: |
          mkdir Resources/real
          mv Resources/Celeste.exe Resources/real/
          cp "$GITHUB_WORKSPACE/$PROBE_BUILD/Probe.exe" Resources/Celeste.exe
          chmod +x MacOS/Celeste
          MacOS/Celeste --game real/Celeste.exe --out "$RUNNER_TEMP/layouts"

      # The probe's layout replaces the committed one, so that the harness always tests the
      # offsets just measured. The probe names the file after the flavour it detected, so a
      # mislabelled matrix entry fails here.
      - name: Build auto splitter with the probe's layout
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          cp "$RUNNER_TEMP/layouts/$FLAVOUR.rs" layouts/
          (cd autosplitter && cargo b --release --locked)

      # The harness starts the probe again, as the game, attaches the auto splitter to it, and
      # runs the live check, then replays every trace. On Linux, the probe is then the
      # harness's descendant, whose memory Yama lets it read. On macOS, reading another
      # process's memory needs root, so the harness runs as root, and starts the probe as the
      # normal user, as players run the game.
      - name: Live check and replay
        timeout-minutes: 5
        run: |
          harness=harness/target/release/harness
          game="$RUNNER_TEMP/game"
          case "$RUNNER_OS" in
            Windows)
              "$harness" replay traces/*.jsonl -- "$game/Celeste.exe" --game real/Celeste.exe ;;
            Linux)
              "$harness" replay traces/*.jsonl -- xvfb-run -a -s "$XVFB_SCREEN" "$game/Celeste" --game real/Celeste.exe ;;
            macOS)
              sudo "$harness" replay traces/*.jsonl -- sudo -u "$(id -un)" "$game/Celeste.app/Contents/MacOS/Celeste" --game real/Celeste.exe ;;
            *)
              echo "::error::No way to start the probe on $RUNNER_OS."
              exit 1 ;;
          esac

      # A difference is a hand edit, or a change to the probe (its manifest or its output)
      # without regenerating the layouts.
      - name: Check committed layout
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          git diff --exit-code -- "layouts/$FLAVOUR.rs" || {
            echo "::error::layouts/$FLAVOUR.rs isn't what the probe writes: regenerate it with the Layouts workflow."
            exit 1
          }

      - name: Upload layout
        uses: actions/upload-artifact@v7
        with:
          name: layout-${{ matrix.flavour }}
          path: ${{ runner.temp }}/layouts/${{ matrix.flavour }}.rs
          if-no-files-found: error
          retention-days: 7

  # Only on dispatch. A pull request needs a branch to go into, so a run dispatched on a
  # tag only probes.
  pull-request:
    name: Open pull request
    needs: probe
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v7

      - name: Download layouts
        uses: actions/download-artifact@v8
        with:
          pattern: layout-*
          merge-multiple: true
          path: layouts

      # Needs "Allow GitHub Actions to create and approve pull requests" in the
      # repository's Actions settings. Each base branch gets one layouts/<base> branch,
      # force-pushed on every run, so an open pull request is updated, not duplicated.
      # GITHUB_TOKEN opens it, so the workflow runs it triggers wait for someone to approve
      # them.
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          BRANCH: layouts/${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[].number')
          git add layouts
          if git diff --cached --quiet; then
            echo "The layouts haven't changed."
            # A pull request from an earlier run no longer matches what the probe measures.
            if [ -n "$open" ]; then
              gh pr close "$open" --delete-branch --comment "Out of date: [a later run]($RUN_URL) found the layouts unchanged."
            fi
            exit 0
          fi
          git diff --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -q -m "Regenerate layouts" -m "Measured by $RUN_URL"
          git push --force origin "$BRANCH"
          if [ -n "$open" ]; then
            echo "Updated the open pull request from $BRANCH."
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "Regenerate layouts" \
              --body "Measured by the probe in [this run]($RUN_URL), on every flavour in its matrix. Each flavour's hand-written signature and store matched its anchor's compiled code. The auto splitter, built with the regenerated layout, reported the distinctive values the probe wrote into the game, the same values flipped, and each flag set alone, in the live check, then every trace's values as the harness replayed them through the probe."
          fi
